name: NBA Player Game Stats

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Import recent NBA player game stats
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          npx tsx -e '
            import { refreshRecentNbaPlayerGameStats } from "./scripts/nba/import-player-game-stats.ts";

            const result = await refreshRecentNbaPlayerGameStats({
              season: "2026-27",
              lookbackDays: 3,
            });

            console.log("NBA player game stats refresh complete:", result);
          '
