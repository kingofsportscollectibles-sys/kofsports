name: NBA Player Game Stats

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Import recent NBA player game stats from ESPN
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TZ: America/New_York
        run: |
          for DAYS_AGO in 3 2 1; do
            GAME_DATE=$(date -d "$DAYS_AGO days ago" +%F)
            echo "Importing NBA player game stats for $GAME_DATE..."
            npx tsx scripts/nba/import-espn-player-game-stats.ts "$GAME_DATE" --write --allow-empty
          done
